# Hazır olan sıradaki dosyayı Instagram'a Reel olarak paylaşır (her akşam ~21:30; yedek: Claude alarmı 21:26).
name: Günlük paylaşım

on:
  schedule:
    # 14 Kasım: her 15 dk kısa kontrol; saat_kapisi.py vakit geldiyse paylaştırır (kanal/slotlar.txt)
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      zorla:
        description: "Bugün paylaşım yapılmış olsa da paylaş"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: gunluk-paylasim
  cancel-in-progress: false

jobs:
  kapi:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      git: ${{ steps.k.outputs.git }}
    steps:
      - uses: actions/checkout@v4
      - id: k
        env:
          FORCE: ${{ inputs.zorla && '1' || '' }}
        run: python3 saat_kapisi.py

  paylas:
    needs: kapi
    if: needs.kapi.outputs.git == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sıradaki hazır bölüm
        id: sec
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.zorla && '1' || '' }}
        run: |
          export READY="$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' | grep '^hazir-' | sed 's/^hazir-//' | tr '\n' ' ')"
          echo "Hazır olanlar: $READY"
          python daily.py pick-publish
      - name: Videoyu indir
        if: steps.sec.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "hazir-${{ steps.sec.outputs.id }}" -D out --repo "${{ github.repository }}"
      - name: ffmpeg (hikâye kırpma + gerekirse yeniden kodlama)
        if: steps.sec.outputs.id != ''
        continue-on-error: true
        timeout-minutes: 6
        run: |
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL --max-time 240 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ff.tar.xz \
              && tar xJf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/
          fi
          ffmpeg -version | head -1
      - name: Instagram'a paylaş
        if: steps.sec.outputs.id != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_MODE: ${{ vars.IG_MODE }}
        run: |
          ID="${{ steps.sec.outputs.id }}"
          python daily.py publish "$ID" --video-path "out/${ID}.mp4" \
            --video-url "https://github.com/${{ github.repository }}/releases/download/hazir-${ID}/${ID}.mp4"
      - name: Kaydı yaz
        if: steps.sec.outputs.id != ''
        run: |
          git config user.name "kissadan-hisse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/posted.json
          git commit -m "Paylaşıldı: bölüm ${{ steps.sec.outputs.id }}" || echo "değişiklik yok"
          git pull --rebase -q && git push
      - name: Sürümü arşivle ve yenisini hazırlat
        if: steps.sec.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID="${{ steps.sec.outputs.id }}"
          gh release delete "hazir-${ID}" --cleanup-tag -y --repo "${{ github.repository }}" || true
          gh workflow run hazirla.yml --repo "${{ github.repository }}"
